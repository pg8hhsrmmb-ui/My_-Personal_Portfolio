<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Portfolio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #24323a;
      background-color: #f4f1E8;
    }

    #greeting {
      color: #24323a;
      font-family: "DM Serif Display", Georgia, serif;
      font-size: 1.5rem;
    }

    #greeting.typing::after {
      content: "|";
      margin-left: 4px;
      animation: cursor-blink 0.8s steps(1) infinite;
    }

    @keyframes cursor-blink {
      50% {
        opacity: 0;
      }

      color: #000000;
      font-family: "DM Serif Display", Georgia, serif;
      font-size: 1.5rem;
  
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100; 
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      padding: 20px;
      background-color: #24323a;
      color: white;
    }

    nav {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-left: auto;
    }

    nav a {
      color: white;
      text-decoration: none;
    }

    nav a.active {
      text-decoration: underline;
      font-weight: bold;
    }

    main {
      width: 100%;
      max-width: none;
      margin: 0;
      padding: 0;
    }

    section {
      max-width: 800px;
      padding: 15px 20px;
      scroll-margin-top: 150px;
    }

    .banner-image {
      display: block;
      width: 100%;
      height: auto;
    }

    #about {
      max-width: none;
      padding: 0;
    }

    #about img {
      display: block;
      width: 100%;
      height: auto;
    }

    #progress-track {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      z-index: 10;
    }

    #progress-bar {
      width: 0;
      height: 100%;
      background-color: #cb694b;
    }

    #back-to-top {
      display: none;
      position: fixed;
      right: 20px;
      bottom: 20px;
      padding: 10px;
      cursor: pointer;
    }

    #back-to-top.visible {
      display: block;
    }

    @media (max-width: 600px) {
      header {
        align-items: flex-start;
        flex-direction: column;
      }

      main {
        padding: 0;
      }

      section {
        padding: 24px 16px;
      }
    }

  </style>

  <script src="index.js" defer></script>
</head>

<body>
  <header>
    <h1>My Portfolio</h1>

    <nav aria-label="Main navigation">
      <a href="#home">Home</a>
      <a href="#about">About Me</a>
      <a href="#projects">Projects</a>
      <a href="#contact">Contact</a>
    </nav>

  </header>

  <div id="progress-track" aria-hidden="true">
    <div id="progress-bar"></div>
  </div>

  <main>
    <section id="home">
      <p id="greeting">Hello! My name is Karen Ong . Welcome to my portfolio.</p>
    </section>

    <img
     class="banner-image"
     src="karen_banner.png"
     alt="A handwritten banner that says Hello, I am Karen! Own your story."
>

    <section id="about">
      <img
       src="about_karen.jpg"
       alt="About Karen: background, skills, and experience"
      >
    </section>

    <section id="projects">
      <h2>Projects</h2>
      <p>My projects will be added here as I complete them.</p>
    </section>

    <section id="contact">
      <h2>Contact</h2>
      <p>Email address: <a href="mailto:104621@siswa.unimas.my">104621@siswa.unimas.my</a></p>
    </section>
  </main>

  <button id="back-to-top" type="button" aria-label="Back to top">
    Back to top ↑
  </button>

  <footer>© <span id="current-year"></span> Karen Ong</footer>

</body>
</html>
